version: '3.8'

services:
  cv-builder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cv-builder-app
    ports:
      - "8080:80"
    volumes:
      - ./src:/usr/share/nginx/html
    restart: unless-stopped
    networks:
      - cv-network

networks:
  cv-network:
    driver: bridge